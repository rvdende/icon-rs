[package]
name = "icon-rs"
version = "0.2.1"
edition = "2024"
description = "SVG icon set for CAD feature tools"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rvdende/icon-rs"
homepage = "https://rvdende.github.io/icon-rs/"
documentation = "https://docs.rs/icon-rs"
readme = "README.md"
keywords = ["icons", "svg", "cad", "ui"]
categories = ["gui", "graphics"]
exclude = ["/.github", "/site", "/tools/build_site.py"]

[lib]
name = "icon_rs"

[features]
# Conversions between Rgb and bevy_color's Color and Srgba.
bevy_color = ["dep:bevy_color"]

[dependencies]
bevy_color = { version = "0.19", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
resvg = "0.48"

[package.metadata.docs.rs]
all-features = true
